<section>
  <div class="row g-0">
    <div class="col-md-10">
      <owl-carousel-o [options]="mainSlider">
        <ng-template carouselSlide>
          <img height="500" src="../../../assets/images/black-friday-elements-assortment.jpg" class="w-100" alt="">
        </ng-template>
        <ng-template carouselSlide><img height="500"
            src="../../../assets/images/woman-holding-various-shopping-bags-copy-space.jpg" class="w-100"
            alt=""></ng-template>
      </owl-carousel-o>
    </div>
    <div class="col-md-2">
      <img height="300" src="../../../assets/images/stylish-woman-with-shopping-bags.jpg" class="w-100" alt="">
      <img height="200"
        src="../../../assets/images/young-brunette-woman-sunglasses-holding-shopping-bags-doing-silent-sign-high-quality-photo.jpg"
        class="w-100" alt="">
    </div>
  </div>
</section>

<section class="my-3">
  <owl-carousel-o [options]="categoriesSliderOption">
    <ng-container *ngFor="let items of categories">
      <ng-template carouselSlide>
        <img [src]="items.image" [alt]="items.name" class="w-100" width="200" height="200">
        <h4 class=" d-flex align-items-center justify-content-between">{{ items.name }}</h4>
      </ng-template>
    </ng-container>
  </owl-carousel-o>
</section>

<section class="my-3">
  <h2>Popular Product</h2>
  <input type="search" class="form-control w-50 mx-auto my-3" placeholder="Search" [(ngModel)]="searchTerms">
  <div class="row g-4">
    <div class="col-md-2" *ngFor="let item of products.slice(0,12) | search : searchTerms">
      <div class="product ">
        <div [routerLink]="['/details', item._id]" class="p-2 cursor-pointer">
          <img [src]="item.imageCover" class="w-100" [alt]="item.title">
          <h3 class="h6">{{item.category.name | uppercase}}</h3>
          <h4 class="h6">{{item.title.split(" ").slice(0,2).join(" ")}}</h4>

          <div class="d-flex align-items-center justify-content-between">
            <span>{{item.price}}</span>
            <div>
              <i class="fas fa-star rating-color"></i>
              <span class="text-muted">{{item.ratingsAverage}}</span>
            </div>
          </div>
        </div>

        <button (click)="addCart(item._id)" class="btn-main w-100">Add Product</button>
      </div>
    </div>
  </div>
</section>
