<section class=" w-75 mx-auto my-5 bg-main-light p-4 rounded shadow">
  <h2>Login</h2>
  <form [formGroup]="loginForm" (ngSubmit)="handleLogin()">

    <div class="form-group">
      <label for="email">Email:</label>
      <input class="form-control" type="email" id="email" formControlName="email">
      <div class="alert alert-danger"
     *ngIf="(loginForm.get('email')?.touched || loginForm.get('email')?.value.length >0)  && loginForm.get('email')?.errors">
        <p *ngIf="loginForm.get('email')?.getError('required')">Email is required.</p>
        <p *ngIf="loginForm.get('email')?.getError('email')">Please enter a valid email address.</p>
      </div>
    </div>
    <div class="form-group">
      <label for="password">Password:</label>
      <input class="form-control" type="password" id="password" formControlName="password">
      <div class="alert alert-danger"
         *ngIf="(loginForm.get('password')?.touched || loginForm.get('password')?.value.length >0) && loginForm.get('password')?.errors">
        <p *ngIf="loginForm.get('password')?.getError('required')">Password is required.</p>
        <p *ngIf="loginForm.get('password')?.getError('pattern')">Password must contain at least one letter and one
          digit, and be at least 8 characters long.</p>
      </div>
    </div>

    <br>
    <button  type="submit" class="btn-main">
      <i *ngIf="isLoading" class="fas fa-spin fa-spinner"></i>
      Login</button>
    <br>
    <p class="alert alert-danger" *ngIf="errorMessages">{{ errorMessages }}</p>
  </form>
</section>
