<section class="w-75 mx-auto bg-main-light p-3 rounded-3 my-2">
  <h1>Shop Cart</h1>
  <p class="text-min">
    Total Price : {{ cartDetails?.totalCartPrice | currency :"EGP" }}
  </p>

  <div class="row border-bottom pd-2" *ngFor="let item of cartDetails?.products">
    <div class="col-md-1">
      <img [src]="item.product.imageCover" class="w-100" alt="">
    </div>
    <div class="col-md-11">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h3 class="h5">{{item.product.title}}</h3>
          <p class="text-main">Price:{{item.price}}</p>
          <button class="btn-main" (click)="removeItem(item.product._id)">
            <i class="fa-regular fa-trash-can"></i>Remove
          </button>
        </div>

        <div>
          <button class="btn border border-success" (click)="updateCount(item.product._id, item.count + 1)">
            +
          </button>

          <span>{{item.count}}</span>

          <button class="btn border border-success" (click)="updateCount(item.product._id, item.count - 1)">
            -
          </button>
        </div>
      </div>
    </div>
  </div>
  <br>
</section>
